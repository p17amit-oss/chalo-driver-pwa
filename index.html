ilar duties.<br><br><b>${t('complaints')} · 10%</b><br>Attributed complaints per 100 trips.<br><br><b>${t('challans')} · 10%</b><br>Synced from the challan tracker.</div>`,`<button class="btn dark wide" id="closeScore">OK</button>`);setTimeout(()=>$('#closeScore').onclick=closeSheet,0)}
