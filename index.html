function openChangeResponse(){const d=currentDuty(),resp=dutyResponse(d);openSheet(t('changeResponse'),'',`<div class="decision"><button class="btn primary" id="chgYes">${t('yesCan')}</button><button class="btn danger" id="chgNo">${t('noCant')}</button></div>`,`<button class="btn ghost" id="chgCancel">${t('cancel')}</button>`);$('#chgYes').onclick=()=>{closeSheet();setResponse('accepted')};$('#chgNo').onclick=()=>{closeSheet();setTimeout(openDeny,120)};$('#chgCancel').onclick=closeSheet}
function openDelay(){const d=currentDuty(),existing=dutyDelay(d);openSheet(t('lateTitle'),t('lateSub'),`<div class="f"><label>${t('delay')}</label><div class="delayChoices" id="delayChoices">${[10,15,20,30,45].map(n=>`<button data-delay="${n}" class="${existing===n?'on':''}">${n} ${t('minutes')}</button>`).join('')}<button data-delay="custom">${t('custom')}</button></div></div><div class="f" id="customDelayWrap" style="display:none"><label>${t('customDelay')}</label><input id="customDelay" type="number" min="1" max="180" inputmode="numeric"></div>${existing?`<button class="btn ghost wide" id="notLate">${t('notLateNow')}</button>`:''}`,`<button class="btn ghost" id="cancelDelay">${t('cancel')}</button><button class="btn primary" id="sendDelay" ${existing?'':'disabled'}>${t('send')}</button>`);let chosen=existing||null;document.querySelectorAll('#delayChoices button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#delayChoices button').forEach(x=>x.classList.remove('on'));b.classList.add('on');chosen=b.dataset.delay;$('#customDelayWrap').style.display=chosen==='custom'?'block':'none';$('#sendDelay').disabled=chosen==='custom'});$('#customDelay')?.addEventListener('input',e=>{$('#sendDelay').disabled=!Number(e.target.value)});$('#cancelDelay').onclick=closeSheet;$('#notLate')?.addEventListener('click',()=>{localStorage.removeItem(delayKey(d));closeSheet();renderDuty();toast(t('lateSuccess'))});$('#sendDelay').onclick=()=>{const n=chosen==='custom'?Number($('#customDelay').value):Number(chosen);localStorage.setItem(delayKey(d),String(n));closeSheet();renderDuty();toast(t('lateSuccess'))}}
function allActiveBuses(){return [...new Set(relevantDuties().flatMap(d=>d.trips.map(x=>x.bus)))]}
const selectedPhotos=[];
function renderIssue(){const buses=allActiveBuses();$('#issueForm').innerHTML=`<div class="f"><label>${t('bus')} *</label><select id="rBus"><option value="">${t('bus')}</option>${buses.map(b=>`<option>${b}</option>`).join('')}</select></div><div class="f"><label>${t('issueCategory')} *</label><select id="rCat"><option value="">${t('selectIssue')}</option>${CAT_KEYS.map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></div><div class="f"><label>${t('whatHappened')} <span class="help">${t('optional')}</span></label><textarea id="rDesc" placeholder="${t('describeIssue')}"></textarea></div><div class="f"><label>${t('photos')} <span class="help">${t('optional')}</span></label><div class="photoActions"><button class="photoAction" id="cameraBtn">📷 ${t('camera')}</button><button class="photoAction" id="galleryBtn">🖼️ ${t('gallery')}</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none"><input id="galleryInput" type="file" accept="image/*" multiple style="display:none"><div class="thumbs" id="thumbs"></div></div><button class="btn primary wide" id="submitIssue" disabled>${t('submit')}</button>`;selectedPhotos.length=0;const validate=()=>{$('#submitIssue').disabled=!($('#rBus').value&&$('#rCat').value)};$('#rBus').onchange=validate;$('#rCat').onchange=validate;$('#cameraBtn').onclick=()=>$('#cameraInput').click();$('#galleryBtn').onclick=()=>$('#galleryInput').click();const addFiles=files=>{[...files].forEach(f=>{if(selectedPhotos.length<4)selectedPhotos.push(f)});$('#thumbs').innerHTML=selectedPhotos.map(f=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"></div>`).join('')};$('#cameraInput').onchange=e=>addFiles(e.target.files);$('#galleryInput').onchange=e=>addFiles(e.target.files);$('#submitIssue').onclick=()=>{$('#issueSuccess').textContent=`${t('issueSubmitted')} · RI-3047`;$('#issueSuccess').classList.add('on');renderIssue();setTimeout(()=>$('#issueSuccess').classList.remove('on'),3500)}}
function renderPerformance(){const c=`<div class="performanceIntro"><div class="eyebrow">${t('last30')}</div><h2>${t('performanceGood')}</h2><p>${t('performanceMsg')}</p></div>`;const rows=[{ic:'◉',title:t('drivingBehaviour'),val:t('harshEvents'),detail:`<div class="detailRow"><span>${t('harshBraking')}</span><b>4</b></div><div class="detailRow"><span>${t('harshAcceleration')}</span><b>7</b></div>`},{ic:'⏱',title:t('punctuality'),val:'92% '+t('onTimeTrips').toLowerCase(),detail:`<div class="detailRow"><span>${t('onTimeTrips')}</span><b>92%</b></div><div class="detailRow"><span>${t('lateTrips')}</span><b>5</b></div><div class="detailRow"><span>${t('avgDelay')}</span><b>4 min</b></div>`},{ic:'☏',title:t('complaints'),val:t('complaintsValue'),detail:`<div class="detailRow"><span>${t('rashDriving')}</span><b>3</b></div><div class="detailRow"><span>${t('rudeBehaviour')}</span><b>1</b></div><div class="detailRow"><span>${t('missedStop')}</span><b>1</b></div><div class="detailRow"><span>${t('otherComplaint')}</span><b>1</b></div>`},{ic:'⚠',title:t('challans'),val:t('challansValue'),detail:`<div class="detailRow"><span>${t('challanAmount')}</span><b>₹1,500</b></div><div class="challan"><div class="c1"><span>12 Sep</span><b>₹1,000</b></div><div class="c2">${t('challan1')}</div></div><div class="challan"><div class="c1"><span>04 Sep</span><b>₹500</b></div><div class="c2">${t('challan2')}</div></div>`}];$('#performanceRoot').innerHTML=c+rows.map(r=>`<div class="metric"><button class="metricBtn"><div class="metricIcon">${r.ic}</div><div class="metricMain"><b>${r.title}</b></div><div class="metricVal"><strong>${r.val}</strong></div><span class="chev">⌄</span></button><div class="metricDetail">${r.detail}</div></div>`).join('');document.querySelectorAll('.metricBtn').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'))}
let notificationsEnabled=(typeof Notification!=='undefined'&&Notification.permission==='granted');
function renderMore(){$('#moreRoot').innerHTML=`<div class="settingsCard"><label>${t('language')}</label><select id="langSettings"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></div><button class="doc"><div class="docicon">🪪</div><div class="grow"><b>${t('licence')}</b><div>${t('licenceNo')}<br>${t('validTill')}</div></div></button><button class="doc"><div class="docicon">☎</div><div class="grow"><b>${t('emergencyContacts')}</b><div>${t('dmContact')}<br>${t('controlRoom')}<br>${t('maintenanceHelp')}</div></div></button><button class="doc"><div class="docicon">?</div><div class="grow"><b>${t('helpSupport')}</b><div>${t('helpSub')}</div></div></button><button class="doc" id="testNotify"><div class="docicon">🔔</div><div class="grow"><b>${t('notifications')}</b><div>${notificationsEnabled?t('notificationsOn'):t('notificationsOff')} · ${t('testNotifications')}</div></div><span class="go">›</span></button><button class="doc"><div class="docicon">👤</div><div class="grow"><b>${t('account')}</b><div>${t('accountSub')}</div></div></button><button class="doc"><div class="docicon">ℹ</div><div class="grow"><b>${t('appVersion')}</b><div>0.5.1 · push test</div></div></button><button class="btn ghost wide" id="logout">${t('logout')}</button>`;$('#langSettings').value=currentLang;$('#langSettings').onchange=e=>setLang(e.target.value);$('#testNotify').onclick=testPushNotification;$('#logout').onclick=()=>{localStorage.removeItem('chaloDriverSignedIn');location.reload()}}
function renderAll(){renderDuty();renderIssue();renderPerformance();renderMore()}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function testPushNotification(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){toast(t('pushNotSupported'));return}
    const permission=await Notification.requestPermission();
    notificationsEnabled=permission==='granted';renderMore();
    if(permission!=='granted'){toast(t('notificationsOff'));return}
    toast(t('testingPush'));
    const reg=await navigator.serviceWorker.ready;
    const keyRes=await fetch('/api/vapid-public-key',{cache:'no-store'});
    if(!keyRes.ok)throw new Error('Could not load push key');
    const {publicKey}=await keyRes.json();
    let sub=await reg.pushManager.getSubscription();
    if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)})}
    const body=currentLang==='hi'?'यह एक टेस्ट पुश नोटिफिकेशन है।':currentLang==='mr'?'हे टेस्ट पुश नोटिफिकेशन आहे.':'This is a test push notification.';
    const res=await fetch('/api/send-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub,title:'Chalo Driver',body,url:'/'})});
    if(!res.ok){const x=await res.json().catch(()=>({}));throw new Error(x.error||'Push send failed')}
    toast(t('testPushSent'));
  }catch(err){console.error(err);toast(err.message||'Push test failed')}
}
